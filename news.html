<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новости — Русское спортивное общество</title>
  <meta name="description" content="Новости индустрии спорта от Русского спортивного общества.">
  <meta name="theme-color" content="#13233f">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="news">
  <div id="site-header"></div>
  <main>
    <section class="page-hero">
      <img class="page-hero-mark" src="assets/img/logo-mark-light.png" alt="">
      <div class="wrap">
        <nav class="breadcrumbs"><a href="index.html">Главная</a><span>Новости</span></nav>
        <h1 class="h1">Будь в курсе событий</h1>
        <p class="lead">Кейсы, аналитика, технологии и главные события индустрии спорта.</p>
        <div class="socials socials-mount" style="margin-top:32px"></div>
      </div>
    </section>
    <section class="section">
      <div class="wrap">
        <div class="filters" id="filters"></div>
        <div class="news-feed" id="news-feed"></div>
      </div>
    </section>
    <section class="section section-ivory" style="padding-top:80px;padding-bottom:100px">
      <div class="wrap">
        <div class="news-follow" style="margin-top:0">
          <div>
            <h3>Рассылка РСО</h3>
            <p>Главное об индустрии спорта — на ваш email.</p>
          </div>
          <form class="subscribe-form">
            <div class="subscribe">
              <label class="sr-only" for="sub-email">Email</label>
              <input id="sub-email" type="email" name="email" placeholder="Ваш email" required>
              <button class="btn btn-gold" type="submit">Подписаться</button>
            </div>
            <p class="form-note">Нажимая кнопку, вы соглашаетесь с <a href="privacy.html">политикой обработки персональных данных</a>.</p>
            <p class="form-status" role="status"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/news.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
